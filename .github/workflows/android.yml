name: Brownux Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Servo derlemesi uzun sürebilir, 6 saat limit koyduk

    steps:
    - name: Kodu İndir
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Android SDK Kur
      uses: android-actions/setup-android@v3

    - name: Rust Kur ve Android Hedeflerini Ekle
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: NDK İndir
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Rust Kütüphanesini Derle (Servo Motoru)
      run: |
        # NDK'daki Clang derleyicisini Rust'a tanıtıyoruz
        export NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        export CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android26-clang
        export AR_aarch64_linux_android=$NDK_BIN/llvm-ar
        
        cargo build --release --target aarch64-linux-android

    - name: Derlenen .so Dosyasını Android'e Kopyala
      run: |
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        cp target/aarch64-linux-android/release/libbrownux.so android/app/src/main/jniLibs/arm64-v8a/

    - name: Android APK Derle
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug

    - name: APK'yı Yükle (İndirilebilir Yap)
      uses: actions/upload-artifact@v4
      with:
        name: Brownux-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
