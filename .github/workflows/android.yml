name: Brownux Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Kodu İndir
      uses: actions/checkout@v4

    - name: Java 17 Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Gradle 8.2 Kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2

    - name: Rust Kur ve Android Hedeflerini Ekle
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Android SDK ve NDK Kur
      run: |
        mkdir -p $HOME/android-sdk/cmdline-tools
        cd $HOME/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses > /dev/null
        sdkmanager "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Rust Kütüphanesini Derle (Servo Motoru)
      run: |
        export NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        export CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android26-clang
        export CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android26-clang++
        export AR_aarch64_linux_android=$NDK_BIN/llvm-ar
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android26-clang

        cargo update -p rmp-serde --precise 0.15.5
        cargo update -p rmp --precise 0.8.11

        cargo build --release --target aarch64-linux-android

    - name: Derlenen .so Dosyasını Android'e Kopyala
      run: |
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        cp target/aarch64-linux-android/release/libbrownux.so android/app/src/main/jniLibs/arm64-v8a/
        cp $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so android/app/src/main/jniLibs/arm64-v8a/

    - name: Android APK Derle
      run: |
        cd android
        gradle assembleDebug --stacktrace

    - name: APK'yı Yükle (İndirilebilir Yap)
      uses: actions/upload-artifact@v4
      with:
        name: Brownux-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
